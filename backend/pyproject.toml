[project]
name = "100x-ai-voice-agent"
version = "0.1.0"
description = "Personal interview voice assistant"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic-settings>=2.7",
 "pymongo[srv]>=4.10", "google-genai>=1.0", "authlib>=1.4",
 "httpx>=0.28", "PyJWT>=2.10", "pwdlib[argon2]>=0.2",
 "email-validator>=2.2", "python-dotenv>=1.0", "itsdangerous>=2.2"
]
[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "httpx>=0.28"]
[tool.ruff]
line-length = 100
